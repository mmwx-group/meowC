name: build

# 打 tag（v*）自动构建、发 GitHub Release 并推 CDN；也可手动触发（workflow_dispatch）只构建某一端（publish 勾上时同样推 CDN）。
# 只发 Android + Windows。Linux 只在手动构建选 linux 时出包（deb + AppImage，amd64 / arm64），不进 release / CDN；macOS 目录保留但不构建。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: '构建哪一端'
        type: choice
        default: all
        options: [all, android, windows, linux]
      android_arch:
        description: 'Android 架构'
        type: choice
        default: arm64
        options: [arm64, universal]
      publish:
        description: '构建完推到 CDN（dl.miaomiaowux.com，更新 latest.json）'
        type: boolean
        default: true

env:
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
  # 手动构建（main）与正式 tag 都算 stable；带 '-' 的 tag（如 v0.2.0-pre1）才是 pre（右上角 PRE 角标）
  IS_STABLE: ${{ !contains(github.ref_name, '-') }}
  IS_PRERELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') }}
  FLUTTER_VERSION: '3.44.9'
  GO_VERSION: '1.26.10'
  NDK_VERSION: '28.2.13676358'
  GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SENTRY_BACKEND: none
  IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN || vars.IPINFO_TOKEN }}

jobs:
  check:
    uses: ./.github/workflows/ci.yaml

  android:
    needs: check
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.android_arch)) || fromJSON('["arm64", "universal"]') }}
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # 内核 core/Clash.Meta 是子模块 mmwx-group/meowx-core
          submodules: true

      - name: Setup Rust (for code_forge / cargokit)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Setup Keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/local.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/local.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/local.properties

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK
        shell: bash
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" >/dev/null 2>&1 || true
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure Cargo for Android
        shell: bash
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          [target.armv7-linux-androideabi]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang"
          [target.x86_64-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang"
          [target.i686-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android26-clang"
          EOF

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-android-${{ hashFiles('**/pubspec.lock') }}

      - name: Clear Pub Cache Credentials
        shell: bash
        run: rm -f ~/.pub-cache/credentials.json 2>/dev/null || true

      - name: Clean Gradle
        run: |
          cd android
          flutter clean

      - name: Build MeowX (Android ${{ matrix.arch }})
        shell: bash
        run: |
          flutter pub get
          dart run build_runner build -d
          dart setup.dart android --arch ${{ matrix.arch }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MeowX-android-${{ matrix.arch }}
          path: ./dist/*
          archive: false
          overwrite: true

  windows:
    needs: check
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      ARCH: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # 内核 core/Clash.Meta 是子模块 mmwx-group/meowx-core
          submodules: true

      - name: Setup Rust (helper service)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-windows-${{ hashFiles('**/pubspec.lock') }}

      - name: Clear Pub Cache Credentials
        shell: bash
        run: rm -f ~/.pub-cache/credentials.json 2>/dev/null || true

      - name: Build Core
        shell: bash
        run: |
          flutter pub get
          dart run build_runner build -d
          dart setup.dart windows --arch ${ARCH} --out core-only

      # helper 服务把核心的 SHA256 烧进二进制，启动前比对；没有 Authenticode 签名时 hash 就取未签名核心的，链路自洽
      - name: Build HelperService
        shell: pwsh
        run: |
          $coreHash = (Get-FileHash libclash/windows/MeowXCore.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Core SHA256 (TOKEN for Helper): $coreHash"
          dart setup.dart windows --arch $env:ARCH --out helper --core-hash $coreHash

      - name: Build MeowX (Windows)
        shell: pwsh
        run: |
          $coreHash = (Get-FileHash libclash/windows/MeowXCore.exe -Algorithm SHA256).Hash.ToLower()
          $appEnv = if ('${{ env.IS_STABLE }}' -eq 'true') { "stable" } else { "pre" }
          $flutterArgs = @(
            "build", "windows", "--release",
            "--dart-define=CORE_SHA256=$coreHash",
            "--dart-define=APP_ENV=$appEnv",
            "--dart-define=APP_ASSET_SUFFIX=windows-$env:ARCH-setup.exe"
          )
          if ($env:IPINFO_TOKEN) { $flutterArgs += "--dart-define=IPINFO_TOKEN=$env:IPINFO_TOKEN" }
          flutter @flutterArgs

      - name: Package Installer (Inno Setup)
        shell: bash
        run: |
          dart windows/packaging/exe/package_windows.dart --arch ${ARCH} --env ${{ env.IS_STABLE == 'true' && 'stable' || 'pre' }}

      # 便携版：Release 目录 + `portable` 标记文件（有它数据就放程序目录的 data/），打成 zip。
      # 不含 helper 服务注册：TUN 模式会走 UAC 提权启动核心；系统代理模式无需管理员。
      - name: Package Portable (zip)
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          $src = "build/windows/x64/runner/Release"
          $stage = "portable/MeowX"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path "$src/*" -Destination $stage -Recurse -Force
          New-Item -ItemType File -Force -Path "$stage/portable" | Out-Null
          New-Item -ItemType Directory -Force -Path dist-portable | Out-Null
          Compress-Archive -Path $stage -DestinationPath "dist-portable/MeowX-$ver-windows-$env:ARCH-portable.zip" -Force
          Get-ChildItem dist-portable

      - name: Upload Portable
        uses: actions/upload-artifact@v7
        with:
          name: MeowX-windows-${{ env.ARCH }}-portable
          path: ./dist-portable/*
          archive: false
          overwrite: true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MeowX-windows-${{ env.ARCH }}
          path: ./dist/*
          archive: false
          overwrite: true

  # Linux：手动构建选 linux 时出包，不进 release / CDN（下面两个发布任务只等 android / windows）。
  # 构建机用 22.04（glibc 2.35）：装得上 Ubuntu 22.04+ / Debian 12+。出包后在干净容器里装一遍、起一次截图。
  linux:
    needs: check
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.platform == 'linux' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # 内核 core/Clash.Meta 是子模块 mmwx-group/meowx-core
          submodules: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libayatana-appindicator3-dev libkeybinder-3.0-dev libfuse2 file

      - name: Setup Rust (for code_forge / cargokit)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      # 官方只发 x64 的 Linux SDK 压缩包：amd64 用 action（带缓存），arm64 按版本号 git 拉
      - name: Setup Flutter (amd64)
        if: matrix.arch == 'amd64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-linux-${{ hashFiles('**/pubspec.lock') }}

      - name: Setup Flutter (arm64)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Setup appimagetool
        run: |
          case "$ARCH" in amd64) a=x86_64 ;; arm64) a=aarch64 ;; esac
          curl -fsSL --retry 3 -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$a.AppImage"
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/

      - name: Clear Pub Cache Credentials
        run: rm -f ~/.pub-cache/credentials.json 2>/dev/null || true

      - name: Build Core
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          dart run build_runner build -d
          dart setup.dart linux --arch ${ARCH} --out core-only

      - name: Build MeowX (Linux)
        run: |
          app_env=${{ env.IS_STABLE == 'true' && 'stable' || 'pre' }}
          args=(--release "--dart-define=APP_ENV=$app_env" "--dart-define=APP_ASSET_SUFFIX=linux-${ARCH}.deb")
          if [ -n "$IPINFO_TOKEN" ]; then args+=("--dart-define=IPINFO_TOKEN=$IPINFO_TOKEN"); fi
          flutter build linux "${args[@]}"

      - name: Package (deb + AppImage)
        run: |
          bash linux/packaging/package_linux.sh ${ARCH}
          ls -la dist
          echo "DEB=$(ls dist/*.deb)" >> "$GITHUB_ENV"
          echo "APPIMAGE=$(ls dist/*.AppImage)" >> "$GITHUB_ENV"

      - name: Upload deb
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.DEB }}
          archive: false
          overwrite: true

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.APPIMAGE }}
          archive: false
          overwrite: true

      # 干净系统里只靠 deb 声明的依赖装一遍：内核要是 root 所有 + setuid、不能有找不到的库；再在虚拟显示里起一次截图
      - name: Smoke Test
        run: |
          mkdir -p smoke
          for image in ubuntu:22.04 ubuntu:24.04; do
            tag=$(echo "$image" | tr ':' '-')
            docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/smoke:/smoke" -e TAG="$tag" "$image" bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq /dist/MeowX-*-linux-*.deb xvfb imagemagick procps >/dev/null
              stat -c "%U:%G %A %n" /usr/share/meowx/MeowXCore | tee /smoke/$TAG-core.txt
              stat -c "%U:%A" /usr/share/meowx/MeowXCore | grep -q "^root:-rws" || { echo "内核没有 root setuid"; exit 1; }
              missing=$(find /usr/share/meowx -type f \( -name "*.so*" -o -name MeowX \) -exec env LD_LIBRARY_PATH=/usr/share/meowx/lib ldd {} \; 2>/dev/null | grep "not found" || true)
              if [ -n "$missing" ]; then echo "缺库：$missing"; exit 1; fi
              xvfb-run -a -s "-screen 0 1440x900x24" bash -c "
                meowx > /smoke/$TAG-run.log 2>&1 &
                pid=\$!
                sleep 30
                import -window root /smoke/$TAG.png
                if kill -0 \$pid 2>/dev/null; then echo alive > /smoke/$TAG-alive.txt; fi
              "
              [ -f /smoke/$TAG-alive.txt ] || { echo "MeowX 没起来或中途退出："; tail -50 /smoke/$TAG-run.log; exit 1; }
            '
          done
          ls -la smoke

      - name: Upload Smoke Result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MeowX-linux-${{ env.ARCH }}-smoke
          path: ./smoke/*
          if-no-files-found: ignore

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [android, windows]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # skip-decompress：产物都是 archive: false 直传的单个文件。不加的话 download-artifact 看到 zip 类型就自动解压——
      # APK / exe 不受影响，唯独便携版 zip 被解成 dist/MeowX/ 目录，下游按文件名找不到它，Release 和 CDN 都漏了便携版
      # （便携版用户的应用内更新只认 kind=portable，漏掉期间查不到新版）。
      - name: Download
        uses: actions/download-artifact@v8
        with:
          path: ./dist/
          pattern: MeowX-*
          merge-multiple: true
          skip-decompress: true

      - name: Check Windows packages
        run: |
          ls -la dist
          if ls dist/MeowX-*-windows-*-setup.exe >/dev/null 2>&1; then
            ls dist/MeowX-*-windows-*-portable.zip >/dev/null 2>&1 \
              || { echo "::error::dist/ 里有 Windows 安装包却没有便携版 zip（被解压了，或 windows job 没打出来）"; exit 1; }
          fi

      - name: Release notes
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          sed -e "s|VERSION|$version|g" ./.github/release_template.md > release.md

      - name: Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: ./dist/*
          body_path: './release.md'
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}

  # 推到 CDN（Cloudflare R2 → dl.miaomiaowux.com/meowx/）并更新 latest.json，App 内检查更新读的就是它。
  # 正式 tag（不带 '-'）自动推；手动构建在 main 上且勾了 publish 才推。只推构建成功的那一端（另一端失败 / 没选时保留线上原条目）。
  # 需要仓库 secrets：R2_ACCOUNT_ID、R2_ACCESS_KEY_ID、R2_SECRET_ACCESS_KEY；可选 variables.R2_BUCKET（默认 mmwx-dl）。
  publish-cdn:
    needs: [android, windows]
    if: >-
      ${{ !cancelled()
          && (needs.android.result == 'success' || needs.windows.result == 'success')
          && ((startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-'))
              || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-cdn
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            pubspec.yaml
          sparse-checkout-cone-mode: false

      # skip-decompress：产物都是 archive: false 直传的单个文件。不加的话 download-artifact 看到 zip 类型就自动解压——
      # APK / exe 不受影响，唯独便携版 zip 被解成 dist/MeowX/ 目录，下游按文件名找不到它，Release 和 CDN 都漏了便携版
      # （便携版用户的应用内更新只认 kind=portable，漏掉期间查不到新版）。
      - name: Download
        uses: actions/download-artifact@v8
        with:
          path: ./dist/
          pattern: MeowX-*
          merge-multiple: true
          skip-decompress: true

      - name: Check Windows packages
        run: |
          ls -la dist
          if ls dist/MeowX-*-windows-*-setup.exe >/dev/null 2>&1; then
            ls dist/MeowX-*-windows-*-portable.zip >/dev/null 2>&1 \
              || { echo "::error::dist/ 里有 Windows 安装包却没有便携版 zip（被解压了，或 windows job 没打出来）"; exit 1; }
          fi

      - name: Test publish script
        run: python3 -m unittest scripts/test_publish_cdn.py

      - name: Publish to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          ls -la dist
          version=$(sed -n 's/^version:[[:space:]]*\([^+]*\)+\(.*\)$/\1/p' pubspec.yaml)
          build=$(sed -n 's/^version:[[:space:]]*\([^+]*\)+\(.*\)$/\2/p' pubspec.yaml | tr -d '\r')
          echo "发布 ${version} (${build})"
          python3 scripts/publish_cdn.py --dist dist --version "$version" --build "$build"
