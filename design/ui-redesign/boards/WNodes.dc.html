<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>MeowX Windows 节点</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.t-light{--bg:#EFE8DF;--card:#FFFFFF;--card2:#F3EDE6;--hero:#F7CDDB;--btnon:#E77FA6;--ink:#2A2130;--ink2:#665A69;--line:rgba(42,33,48,.10);--pink:#F3A6BF;--soft:#FCE4EC;--rose:#B02E63;--good:#17693F;--warn:#9A5200;--bad:#B93228;--vio:#5B45B0;--gold:#A8700A;--silver:#6E7480}
</style>
</helmet>
<div class="t-light" style="width: 1100px; height: 720px; box-sizing: border-box; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', system-ui, sans-serif; display: flex">
  <div style="width: 220px; flex-shrink: 0">
    <dc-import name="WinSidebar" active="nodes" dark="{{no}}" compact="{{no}}" height="{{h}}" hint-size="220px,720px"></dc-import>
  </div>

  <div style="flex-grow: 1; min-width: 0; padding: 12px 16px 16px 20px; display: flex; flex-direction: column; gap: 12px">
    <!-- 标题行 = 自绘标题栏 -->
    <div style="display: flex; align-items: center; gap: 8px; height: 44px; flex-shrink: 0">
      <div style="flex-grow: 1; display: flex; align-items: baseline; gap: 10px">
        <span style="font-family: ui-rounded, 'Segoe UI Variable Display', 'Segoe UI', 'Microsoft YaHei UI', system-ui, sans-serif; font-size: 24px; font-weight: 700">节点</span>
        <span style="font-size: 12px; color: var(--ink2)">6 个代理组 · 48 个节点</span>
      </div>
      <button aria-label="卡片尺寸：标准 / 大" style="width: 40px; height: 40px; border-radius: 20px; background: var(--card); display: flex; align-items: center; justify-content: center">
        <svg class="i" viewBox="0 0 24 24" width="18" height="18"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
      </button>
      <button style="height: 40px; padding: 0 14px; border-radius: 20px; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 5px">
        <svg class="i" viewBox="0 0 24 24" width="15" height="15"><path d="M13 2L5 14h6l-1 8 8-12h-6z"/></svg>
        <span>全部测速</span>
      </button>
      <span style="width: 1px; height: 20px; background: var(--line); margin: 0 4px"></span>
      <button aria-label="窗口置顶" style="width: 36px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--ink2)">
        <svg class="i" viewBox="0 0 24 24" width="15" height="15"><path d="M9 4h6l-1 6 3 3v2H7v-2l3-3zM12 15v6"/></svg>
      </button>
      <button aria-label="最小化" style="width: 36px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--ink2)">
        <svg class="i" viewBox="0 0 24 24" width="15" height="15"><path d="M6 12h12"/></svg>
      </button>
      <button aria-label="最大化" style="width: 36px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--ink2)">
        <svg class="i" viewBox="0 0 24 24" width="14" height="14"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
      <button aria-label="关闭到托盘" style="width: 36px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--ink2)">
        <svg class="i" viewBox="0 0 24 24" width="15" height="15"><path d="M7 7l10 10M17 7L7 17"/></svg>
      </button>
    </div>

    <div style="flex-grow: 1; min-height: 0; display: flex; gap: 14px">
      <!-- 左栏：代理组 -->
      <div style="width: 250px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
          <button aria-pressed="{{g.selected}}" style="text-align: left; background: {{g.bg}}; box-shadow: {{g.ring}}; border-radius: 16px; padding: 9px 12px; display: flex; flex-direction: column; gap: 4px; min-height: 58px; box-sizing: border-box">
            <span style="display: flex; align-items: center; gap: 6px; width: 100%">
              <span style="flex-grow: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.name}}</span>
              <span style="flex-shrink: 0; font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 10px; font-weight: 600; color: var(--rose); background: {{g.typeBg}}; border-radius: 7px; padding: 1px 6px">{{g.type}}</span>
            </span>
            <span style="display: flex; align-items: center; gap: 6px; width: 100%">
              <span style="flex-grow: 1; min-width: 0; font-size: 12px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.current}}</span>
              <span style="flex-shrink: 0; font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 11px; font-weight: 700; color: {{g.msColor}}">{{g.ms}}</span>
            </span>
          </button>
        </sc-for>
      </div>

      <!-- 右栏：当前组 -->
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px">
        <div style="background: var(--hero); border-radius: 20px; padding: 10px 12px 10px 14px; display: flex; align-items: center; gap: 10px; flex-shrink: 0">
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <div style="display: flex; align-items: center; gap: 6px">
              <span style="font-size: 15px; font-weight: 700">自动选择</span>
              <span style="font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 11px; font-weight: 600; color: var(--rose); background: var(--card); border-radius: 8px; padding: 1px 7px">url-test</span>
              <span style="font-size: 12px; color: var(--ink2)">12 个成员 · {{pinHint}}</span>
            </div>
            <div style="font-size: 12px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">当前 {{currentName}} · {{currentMs}}</div>
          </div>
          <button onClick="{{unpin}}" aria-pressed="{{auto}}" style="height: 40px; padding: 0 6px 0 12px; border-radius: 20px; background: var(--card); display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">
            <span>自动选择</span>
            <span style="width: 42px; height: 26px; border-radius: 13px; background: {{swBg}}; padding: 3px; box-sizing: border-box; display: flex; justify-content: {{swAlign}}">
              <span style="width: 20px; height: 20px; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(42,33,48,.3)"></span>
            </span>
          </button>
          <button style="height: 40px; padding: 0 14px; border-radius: 20px; background: var(--card); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 4px">
            <svg class="i" viewBox="0 0 24 24" width="15" height="15" style="color: var(--rose)"><path d="M13 2L5 14h6l-1 8 8-12h-6z"/></svg>
            <span>测速</span>
          </button>
        </div>

        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{nodes}}" as="n" hint-placeholder-count="12">
            <button onClick="{{n.pick}}" aria-pressed="{{n.selected}}" style="text-align: left; background: {{n.bg}}; box-shadow: {{n.ring}}; border-radius: 16px; padding: 9px 11px; display: flex; flex-direction: column; gap: 5px; min-height: 58px; box-sizing: border-box">
              <span style="display: flex; align-items: center; gap: 6px; min-width: 0; width: 100%">
                <span style="flex-shrink: 0; font-size: 10px; font-weight: 700; color: var(--ink2); background: var(--card2); border-radius: 5px; padding: 2px 5px">{{n.cc}}</span>
                <span style="flex-grow: 1; min-width: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.name}}</span>
                <sc-if value="{{n.pinned}}" hint-placeholder-val="{{false}}">
                  <svg viewBox="0 0 24 24" width="13" height="13" aria-label="已固定，再点一次恢复自动选择" style="flex-shrink: 0; fill: var(--rose)"><path d="M9 3h6l-1 6 3 3v2h-5v6l-1 1-1-1v-6H5v-2l3-3z"/></svg>
                </sc-if>
              </span>
              <span style="display: flex; align-items: center; gap: 6px; width: 100%">
                <span style="flex-grow: 1; min-width: 0; font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 11px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.sub}}</span>
                <sc-if value="{{n.medal}}" hint-placeholder-val="{{false}}">
                  <svg viewBox="0 0 24 24" width="14" height="14" aria-label="回程奖牌" style="flex-shrink: 0; fill: {{n.medalColor}}"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8-6.1-3.5-6.1 3.5 1.4-6.8L2.200 9.1l6.900-.8z"/></svg>
                </sc-if>
                <sc-if value="{{n.unlock}}" hint-placeholder-val="{{false}}">
                  <svg class="i" viewBox="0 0 24 24" width="13" height="13" aria-label="流媒体解锁" style="flex-shrink: 0; color: {{n.unlockColor}}"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/></svg>
                </sc-if>
                <span style="flex-shrink: 0; font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 11px; font-weight: 700; color: {{n.msColor}}; background: var(--card2); border-radius: 9px; padding: 2px 7px">{{n.msText}}</span>
              </span>
            </button>
          </sc-for>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1100,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      { id: 'hk1', cc: 'HK', name: '香港 01 · IEPL', sub: 'vless · reality', ms: 38, medal: 'gold', unlock: 'full' },
      { id: 'hk2', cc: 'HK', name: '香港 02 · BGP', sub: 'trojan · ws', ms: 52, medal: 'silver', unlock: 'part' },
      { id: 'jp1', cc: 'JP', name: '东京 01 · IIJ', sub: 'hy2', ms: 61, medal: 'gold', unlock: 'full' },
      { id: 'jp2', cc: 'JP', name: '大阪 02', sub: 'ss', ms: 74, unlock: 'part' },
      { id: 'sg1', cc: 'SG', name: '新加坡 01', sub: 'vmess · tls · ws', ms: 88, unlock: 'full' },
      { id: 'tw1', cc: 'TW', name: '台北 01 · HiNet', sub: 'anytls', ms: 96, medal: 'silver' },
      { id: 'us1', cc: 'US', name: '洛杉矶 01 · 9929', sub: 'miu · vision', ms: 148, medal: 'gold', unlock: 'full' },
      { id: 'us2', cc: 'US', name: '圣何塞 02', sub: 'trojan', ms: 171, unlock: 'part' },
      { id: 'kr1', cc: 'KR', name: '首尔 01', sub: 'ss', ms: 83 },
      { id: 'de1', cc: 'DE', name: '法兰克福 01', sub: 'mieru', ms: 236 },
      { id: 'gb1', cc: 'GB', name: '伦敦 01', sub: 'trojan', ms: 0 },
      { id: 'au1', cc: 'AU', name: '悉尼 01', sub: 'vless · reality', ms: 312 }
    ];
    const pinned = this.state && this.state.pinned !== undefined ? this.state.pinned : null;
    const current = pinned || 'hk1';
    const color = (ms) => ms === 0 ? 'var(--bad)' : ms < 100 ? 'var(--good)' : ms < 200 ? 'var(--warn)' : 'var(--bad)';
    const nodes = raw.map((n) => {
      const sel = n.id === current;
      return {
        cc: n.cc, name: n.name, sub: n.sub, selected: sel, pinned: n.id === pinned,
        bg: sel ? 'var(--soft)' : 'var(--card)',
        ring: sel ? 'inset 0 0 0 2px var(--rose)' : 'none',
        medal: !!n.medal, medalColor: n.medal === 'gold' ? 'var(--gold)' : 'var(--silver)',
        unlock: !!n.unlock, unlockColor: n.unlock === 'full' ? 'var(--good)' : 'var(--warn)',
        msText: n.ms === 0 ? '超时' : n.ms + ' ms', msColor: color(n.ms),
        pick: () => this.setState({ pinned: n.id === pinned ? null : n.id })
      };
    });
    const cur = raw.find((n) => n.id === current);
    const groups = [
      { name: '节点选择', type: 'select', current: '自动选择', ms: '38 ms', c: 'var(--good)' },
      { name: '自动选择', type: 'url-test', current: cur.name, ms: cur.ms + ' ms', c: color(cur.ms), on: true },
      { name: '流媒体', type: 'select', current: '东京 01 · IIJ', ms: '61 ms', c: 'var(--good)' },
      { name: 'AI 服务', type: 'fallback', current: '洛杉矶 01 · 9929', ms: '148 ms', c: 'var(--warn)' },
      { name: 'Telegram', type: 'select', current: '新加坡 01', ms: '88 ms', c: 'var(--good)' },
      { name: '漏网之鱼', type: 'select', current: '节点选择', ms: '38 ms', c: 'var(--good)' }
    ].map((g) => ({
      name: g.name, type: g.type, current: g.current, ms: g.ms, msColor: g.c, selected: !!g.on,
      bg: g.on ? 'var(--soft)' : 'var(--card)',
      ring: g.on ? 'inset 0 0 0 2px var(--rose)' : 'none',
      typeBg: g.on ? 'var(--card)' : 'var(--card2)'
    }));
    return {
      no: false, h: 720,
      nodes: nodes, groups: groups,
      auto: !pinned,
      currentName: cur.name, currentMs: cur.ms + ' ms',
      pinHint: pinned ? '已固定' : '自动',
      swBg: pinned ? 'var(--card2)' : 'var(--btnon)',
      swAlign: pinned ? 'flex-start' : 'flex-end',
      unpin: () => this.setState({ pinned: null })
    };
  }
}
</script>
</body>
</html>
